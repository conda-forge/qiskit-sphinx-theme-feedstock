{% set name = "qiskit-sphinx-theme" %}
{% set version = "2.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/qiskit_sphinx_theme-{{ version }}.tar.gz
  sha256: 5abd24d33dfe6488d3fc8e9e48905592b36366ad304bb3ce09c3f95b7320dfb0

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - sphinx-theme-builder >=0.2.0b2
    - pip
  run:
    - python >={{ python_min }}
    - docutils
    - sphinx >=6.0,<9.0
    - furo ==2024.8.6

test:
  imports:
    - qiskit_sphinx_theme
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/Qiskit/qiskit_sphinx_theme
  summary: A Sphinx theme for Qiskit and Qiskit Ecosystem projects
  license: Apache-2.0
  license_file: LICENSE
  doc_url: https://qisk.it/docs-guide

extra:
  recipe-maintainers:
    - wshanks
