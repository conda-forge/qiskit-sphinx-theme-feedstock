schema_version: 1

context:
  version: "2.1.1"

package:
  name: qiskit-sphinx-theme
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/q/qiskit-sphinx-theme/qiskit_sphinx_theme-${{ version }}.tar.gz
  sha256: aad41382a460e004b99f9dbba59cda3d489dcff25a7f2c3f11fa3358da87c116

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - sphinx-theme-builder >=0.2.0b2
    - pip
  run:
    - python >=${{ python_min }}
    - docutils
    - sphinx >=7.0,<10.0
    - furo ==2025.12.19

tests:
  - python:
      imports:
        - qiskit_sphinx_theme
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: A Sphinx theme for Qiskit and Qiskit Ecosystem projects
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/qiskit-sphinx-theme/

extra:
  recipe-maintainers:
    - wshanks
